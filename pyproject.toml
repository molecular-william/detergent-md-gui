# Tool configuration. pytest's configuration lives in `pytest.ini`, in one place and only there.
# It used to be mirrored here so that `pytest` and `python -m pytest` behaved the same whichever
# file was discovered first -- but a mirror is a trap rather than a safeguard: `pytest.ini` wins
# by discovery order, so an edit to the copy that used to sit below changed nothing at all while
# looking authoritative. One file, one answer.
#
# dashboard/.venv lives *inside* the package directory, so any tool that globs `dashboard/**`
# walks roughly 20 000 vendored files unless it is excluded here. That is the reason this file
# exists at all (see the plan's Task 8.1); the repository had no tool config before it.

[tool.ruff]
target-version = "py312"
# The codebase writes long single-line stage dictionaries on purpose (workflow.run's per-stage
# entry is ~380 characters). 160 is a ceiling the majority of the code already meets, which keeps
# the E501 signal meaningful instead of drowning every other finding.
line-length = 160
exclude = [".venv", "dashboard/.venv", "archive", "references", "resources", "tools", "workspace"]

[tool.ruff.lint]
# The default selection is the *gate*: rules whose findings are defects or mechanical
# correctness problems -- F (pyflakes: undefined names, unused imports and locals), E9
# (syntax/IO errors) and I (import order, which is safe to fix automatically). It is meant to
# exit 0 on this repository, so that a non-zero exit is a signal rather than noise.
#
# Style rules are deliberately NOT in the gate. This codebase writes dense single-line
# dictionaries and long lines on purpose (workflow.run's per-stage attempt entry is ~380
# characters), and 1000+ E501/E701/E702 findings would drown every real finding. Review them
# on demand instead:
#   dashboard/.venv/bin/python -m ruff check dashboard tests --select E,W
# See docs/decisions/2026-09-24-architecture-decisions.md for why this split was chosen.
select = ["F", "E9", "I"]
