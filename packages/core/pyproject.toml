# The engine distribution: the run lifecycle, persistence, tool resolution, molecule and mapping models,
# the analysis worker and the dashboard shell. The two selectable halves are `packages/validation` and
# `packages/pdc`; the repository's meta distribution names them as extras.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detergent-core"
version = "0.2.0"
description = "Local GROMACS/Martini run lifecycle and dashboard engine."
requires-python = ">=3.12"
# The scientific stack (numpy, MDAnalysis, mdtraj's dependants, GROMACS) is provisioned by the host
# environment; these are the dashboard's own third-party imports.
dependencies = [
  "flask",
  "werkzeug",
  "plotly",
  "rdkit",
]

[project.scripts]
detergent-dashboard = "dashboard.cli.serve:main"
detergent-import-run = "dashboard.cli.import_run:main"

[tool.setuptools.package-data]
# The shell is data, not modules: the template, the stylesheets, the panel scripts and the vendored NGL bundle are
# read from the installed package, so a wheel without them starts and then cannot render a page.
"dashboard.web" = ["templates/*.html", "static/*.css", "static/js/*.js", "static/vendor/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dashboard*"]
