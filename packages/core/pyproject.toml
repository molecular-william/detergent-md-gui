# The engine distribution: the run lifecycle, persistence, tool resolution, molecule and mapping models,
# the analysis worker and the dashboard shell. The two selectable halves are `packages/validation` and
# `packages/pdc`; the repository's meta distribution names them as extras.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detergent-core"
version = "0.2.0"
description = "Local GROMACS/Martini run lifecycle and dashboard engine."
requires-python = ">=3.12"
# Most of the scientific stack (MDAnalysis, mdtraj's dependants, GROMACS) is provisioned by the host environment.
# numpy is declared because the analyses depend on its *version*, not only its presence: `dihedral_fit`,
# `bonded_estimate` and `bartender_fit` spell their batch dot products `np.vecdot` (numpy 2), which is what makes a
# batch round exactly as the per-row `np.dot` the fit compares against. `(a*b).sum(axis=-1)` sums in another order
# and moves an angle on the +-180 branch cut into a different histogram bin. Floor: numpy 2.
dependencies = [
  "flask",
  "werkzeug",
  "plotly",
  "rdkit",
  "numpy>=2",
]

[project.scripts]
detergent-dashboard = "dashboard.cli.serve:main"
detergent-import-run = "dashboard.cli.import_run:main"


[tool.setuptools.package-data]
# The shell is data, not modules: the template, the stylesheets, the panel scripts and the vendored NGL bundle are
# read from the installed package, so a wheel without them starts and then cannot render a page.
"dashboard.web" = ["templates/*.html", "static/*.css", "static/js/*.js", "static/vendor/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dashboard*"]
