# The protein-detergent feature distribution: the ten-stage pdc pipeline, its panel API and its stage scripts.
# It depends on the engine (`detergent-core`); the engine never imports it.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detergent-pdc"
version = "0.2.0"
description = "Protein-detergent simulations for the detergent-md-gui dashboard."
requires-python = ">=3.12"
dependencies = ["detergent-core==0.2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# The tests live beside each package (`tests/`) but are not shipped: this extra is the dev-side install of the runner,
# not a dependency of the dashboard. The scientific stack and the fixtures' own libraries stay host-provided.
test = ["pytest>=8", "pytest-xdist>=3.6,<4", "playwright>=1.40"]

[tool.setuptools.package-data]
detergent_pdc = ["templates/panels/*.html", "templates/fragments/*.html", "static/*.css", "static/js/*.js"]

[project.entry-points."detergent_md.features"]
# Installing this wheel is what makes the feature part of a dashboard; the engine discovers it from this entry point.
pdc = "detergent_pdc.feature"
