[pytest]
testpaths = tests/dashboard
# Measured on this checkout, 2026-10-10: the fast tier ('not browser and not slow') is 1223 tests in
# about 12 s at these flags, and the browser tier is 66 tests in about 345 s at -n 2. The whole-suite
# figure that used to live here (79.3 s serial / 19.6 s parallel) was stale by a factor of two and is
# gone rather than corrected, because a timing nobody re-measures is a claim that rots.
# (loadfile, not load: plain -n interleaves the OpenMP probe subprocesses with Chromium page loads and
# only reaches about 51.7 s.) Every test keeps its own tmp_path workspace and binds port 0, so workers
# cannot collide; the browser tier was verified at -n 2..64.
# Serial runs (debugging, or the slow tier) take -n 0.
addopts = -n 8 --dist loadfile --strict-markers
markers =
    browser: rendered dashboard interaction tests (requires installed Playwright and Chrome)
    slow: subprocess, GROMACS, or long-lived worker checks (optional fast-loop exclusion)
