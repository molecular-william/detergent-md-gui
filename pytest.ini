[pytest]
testpaths = tests/dashboard
# Measured on this checkout, 2026-10-12: the fast tier ('not browser and not slow') is 1238 tests in
# about 14 s at these flags, and the browser tier is 67 tests in about 105 s at -n 2. That browser
# figure was taken while another job on this machine held a core, so it is an upper bound rather than
# a baseline -- the tier runs in roughly half that on an idle box, and its element waits are the first
# thing to go wrong when the machine is busy. Quote the measurement, not this comment.
# The whole-suite figure that used to live here (79.3 s serial / 19.6 s parallel) was stale by a factor
# of two and is gone rather than corrected, because a timing nobody re-measures is a claim that rots;
# so is the 345 s browser figure that replaced it, which no run in this session reproduced.
# (loadfile, not load: plain -n interleaves the OpenMP probe subprocesses with Chromium page loads and
# only reaches about 51.7 s.) Every test keeps its own tmp_path workspace and binds port 0, so workers
# cannot collide; the browser tier was verified at -n 2..64.
#
# Re-measured 2026-10-20 on this checkout (72 cores): the browser tier is 223 tests -- 37 s at
# `-n 24 --dist worksteal`; at 218 tests it was 112 s at `-n 6 --dist loadfile`, 85 s at
# `-n 12 --dist loadfile`, 60 s at `-n 12 --dist worksteal`, 44 s at `-n 24 --dist worksteal` (best
# green), 48 s at `-n 32`, and 43 s at `-n 48` with one load-sensitive test failing. `loadfile` chunks
# by file and file durations are lopsided, which is why `worksteal` wins on this tier; it belongs on
# the browser command and not in `addopts`, because it makes the fast tier slower (21.6 s against
# 19.4 s at `-n 8`) by giving up per-file fixture reuse.
# Serial runs (debugging, or the slow tier) take -n 0.
addopts = -n 8 --dist loadfile --strict-markers
markers =
    browser: rendered dashboard interaction tests (requires installed Playwright and Chrome)
    slow: subprocess, GROMACS, or long-lived worker checks (optional fast-loop exclusion)
