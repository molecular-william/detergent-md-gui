[pytest]
testpaths = tests/dashboard
# Measured on this checkout 2026-10-22 (72 cores): 2,365 tests in three tiers --
#   fast    2,046  ('not browser and not slow')  ~21 s at the addopts below (-n 8 --dist loadfile)
#   browser   252  (`-m browser`)                ~50 s at -n 16 --dist worksteal
#   slow       67  (`-m slow`)                   serially, -n 0
# Quote a fresh measurement rather than this comment: the counts move with every slice, and a timing nobody re-measures
# rots. Why `loadfile` here and `worksteal` on the browser tier: loadfile chunks by file and the browser tier's file
# durations are lopsided, while in the fast tier worksteal costs per-file fixture reuse (measured 21.6 s against 19.4 s
# at -n 8). The browser tier's own flake history is load, not parallelism -- it appears at -n 16 and -n 24 alike, and
# 16 is the documented command because 6 s is worth more as headroom than as speed.
# Serial runs (debugging, or the slow tier) take -n 0.
addopts = -n 8 --dist loadfile --strict-markers
# Areas are a second axis, applied from tests/dashboard/areas.py (`pytest_collection_modifyitems`): `-m pdc` is the
# protein-detergent work, `-m 'mapping and not browser'` the mapping work without a browser, `-m 'pdc and not slow'` the
# part of it that needs no subprocess. `-m 'not browser and not slow'` stays the fast tier.
markers =
    browser: rendered dashboard interaction tests (requires installed Playwright and Chrome)
    slow: subprocess, GROMACS, or long-lived worker checks (optional fast-loop exclusion)
    pdc: protein-detergent builds -- adapter, placement, stages, back-map
    mapping: CG bead assignment and its editor
    bonded: fitted bonded terms, parameterizations, the Bond Interactions panel
    carbohydrate: sugars, sucrose references, carbohydrate validation
    aa: the all-atom half
    analysis: analyses, scoring, snapshots, figures, consistency
    osmotic: the osmotic-pressure series
    molecules: detergent and molecule catalogue, composition, properties
    web: the application, routes, panels, client bundles
    runs: job lifecycle, stages, resume, progress, run view
    infra: tools, devices, protocol, repository contracts
