[pytest]
testpaths = tests/dashboard
# Measured on this checkout 2026-10-22 (72 cores): 2,204 tests in three tiers --
#   fast    1,896  ('not browser and not slow')  ~19 s at the addopts below (-n 8 --dist loadfile)
#   browser   241  (`-m browser`)                ~41 s at -n 16 --dist worksteal
#   slow       67  (`-m slow`)                   serially, -n 0
# Quote a fresh measurement rather than this comment: the counts move with every slice, and a timing nobody re-measures
# rots. Why `loadfile` here and `worksteal` on the browser tier: loadfile chunks by file and the browser tier's file
# durations are lopsided, while in the fast tier worksteal costs per-file fixture reuse (measured 21.6 s against 19.4 s
# at -n 8). The browser tier's own flake history is load, not parallelism -- it appears at -n 16 and -n 24 alike, and
# 16 is the documented command because 6 s is worth more as headroom than as speed.
# Serial runs (debugging, or the slow tier) take -n 0.
addopts = -n 8 --dist loadfile --strict-markers
markers =
    browser: rendered dashboard interaction tests (requires installed Playwright and Chrome)
    slow: subprocess, GROMACS, or long-lived worker checks (optional fast-loop exclusion)
